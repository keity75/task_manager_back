[tool.poetry]
name = "fastapi-project"
version = "0.1.0"
description = "FastAPI + Firestore Emulator Project"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
email-validator = "^2.3.0"
google-cloud-firestore = "2.16.1"
httpx = "^0.27.0"
pydantic-settings = "^2.5.0"
tenacity = "^9.0.0"
structlog = "^24.4.0"
python-dotenv = "^1.0.0"
pyjwt = "^2.9.0"
cryptography = "^43.0.0"  # プロバイダートークン暗号化用（AES-256-GCM）
google-api-python-client = "^2.0.0"
google-auth = "^2.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.2"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
coverage = "^7.6.0"
debugpy = "^1.8.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py313"

# チェック除外ディレクトリ
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "build",
    "dist",
    "migrations"
]

# Lintルール
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- 基本設定 ---
    "E501",   # 行長の警告はline-lengthで一元管理
    "T201",   # print() の使用を許可 (デバッグ用)
    "ERA001", # コメントアウトされたコードを許可 (試行錯誤のため)
    "INP001", # __init__.py が空でもOK

    # --- Docstring関連 (まずは機能実装を優先) ---
    "D100",   # モジュールのdocstringは不要
    "D104",   # パッケージのdocstringは不要
    "D107",   # __init__のdocstringは不要
    "D203",
    "D213",
    "D400",   # docstringの先頭を大文字にしなくてもOK
    "D415",   # docstringの末尾にピリオドがなくてもOK

    # --- 型ヒント関連 (厳格すぎると書きづらい) ---
    "ANN401", # typing.Anyの使用を許可 (APIレスポンスなど動的なデータ構造のため)

    # --- コード構造の柔軟性 (リファクタリング前提) ---
    "RET504", # return前の変数代入を許可
    "C901",   # 関数の複雑度が高くてもOK (プロトタイピングのため)
    "PLR0913",# 関数の引数が多くてもOK
    "S101",   # assert文の使用を許可 (開発中のチェック用)
    "COM812",
    "TRY301",
]

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "google.cloud.*",
    "firebase_admin.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
    # protobuf/google系の既知将来警告（Firestore依存経由）
    "ignore:Type google\\._upb\\._message\\.MessageMapContainer uses PyType_Spec with a metaclass that has custom tp_new\\. This is deprecated and will no longer be allowed in Python 3\\.14\\.:DeprecationWarning",
    "ignore:Type google\\._upb\\._message\\.ScalarMapContainer uses PyType_Spec with a metaclass that has custom tp_new\\. This is deprecated and will no longer be allowed in Python 3\\.14\\.:DeprecationWarning",
    # FastAPI + Pydantic組み合わせで発生する既知互換警告
    "ignore:The '(alias|validation_alias|serialization_alias)' attribute with value '.*' was provided to the `Field\\(\\)` function, which has no effect in the context it was used\\..*",
]
